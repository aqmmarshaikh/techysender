<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary Meta Tags -->
    <title>TECHYSENDER – Secure P2P File Sharing</title>
    <meta name="title" content="TECHYSENDER – Secure P2P File Sharing" />
    <meta name="description" content="Send files instantly with end-to-end encryption, WebRTC technology, QR sharing, and secure short links. No sign-up. No storage. Just private file transfers." />

    <meta name="bingbot" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://techysender.app/" />

    <meta name="google-site-verification" content="GOOGLE_SEARCH_CONSOLE_VERIFICATION_PLACEHOLDER" />
